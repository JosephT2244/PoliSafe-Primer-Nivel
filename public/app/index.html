<!DOCTYPE html>
<html lang="es-MX">
<head>
  <!--
    Si la app se publica en una subcarpeta, cambia el valor de href.
    La ruta debe empezar y terminar con "/". `flutter build` sustituye
    /app/ por el valor del argumento --base-href.
  -->
  <base href="/app/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Seguimiento de enfermedades crónicas para la enfermería de primer nivel de Jalisco, con las metas de las normas oficiales, y PoliSafe completo. Los datos se quedan en este navegador.">

  <!-- Color de la barra del navegador, en tema claro y oscuro (guia de interfaz, 3.1). -->
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#660033">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#171214">

  <!-- iOS -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="PoliSafe Primer Nivel">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>PoliSafe Primer Nivel</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
